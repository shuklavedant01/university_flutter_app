name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build APK via Flutter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Platform
        run: |
          cp pubspec.yaml pubspec.backup.yaml
          flutter create --org com.veritas --project-name veritas_university_app --platforms=android .
          cp pubspec.backup.yaml pubspec.yaml

      - name: Configure Android Permissions in AndroidManifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          echo "=== android/app/src/main/AndroidManifest.xml ==="
          cat android/app/src/main/AndroidManifest.xml

      - name: Fetch Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: veritas-university-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
